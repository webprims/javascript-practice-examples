<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit animation | WebPrims</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-content:center;text-align:center;font:16px system-ui;background:#f4f8ff;color:#132e53}.scene{width:240px;height:240px;position:relative;margin:2rem auto;border:2px dashed #7998c9;border-radius:50%;display:grid;place-items:center}.center{background:#245fd2;color:white;padding:1.1rem;border-radius:50%;font-weight:700}.orbit{position:absolute;inset:0;animation:turn 6s linear infinite}.satellite{position:absolute;left:50%;top:-17px;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:#ffad40;box-shadow:0 3px 12px #132e5340}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.orbit{animation:none}.satellite{top:0;left:50%;transform:translate(-50%,-50%)}}
</style>
<main><h1>Orbit animation</h1><p>One rotating wrapper, one satellite, no JavaScript.</p><div class="scene" role="img" aria-label="A small dot orbiting a WebPrims circle"><span class="center">WP</span><span class="orbit" aria-hidden="true"><span class="satellite"></span></span></div><p>Try changing the 6s duration or the scene size. Reduced motion keeps a still illustration.</p></main></html>
