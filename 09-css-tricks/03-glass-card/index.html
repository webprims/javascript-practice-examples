<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glass Card</title>
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #374151);
    }

    .glass {
      width: min(320px, 80vw);
      padding: 28px;
      border-radius: 22px;
      color: white;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.24);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .glass h2 { margin-top: 0; }
  </style>
</head>
<body>
  <section class="glass">
    <h2>Glassmorphism</h2>
    <p>Use transparency, blur and a subtle border to create a glass effect.</p>
  </section>
</body>
</html>
