<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Label Input</title>
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .field {
      position: relative;
      width: 280px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px 12px 10px;
      border: 1px solid #9ca3af;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }

    label {
      position: absolute;
      left: 12px;
      top: 14px;
      pointer-events: none;
      transition: .2s ease;
      background: white;
      padding: 0 4px;
      color: #6b7280;
    }

    input:focus + label,
    input:not(:placeholder-shown) + label {
      top: -8px;
      font-size: 12px;
      color: #111827;
    }
  </style>
</head>
<body>
  <div class="field">
    <input id="email" type="email" placeholder=" " />
    <label for="email">Email address</label>
  </div>
</body>
</html>
