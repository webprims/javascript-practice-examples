<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hover Card</title>
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    .card {
      width: 280px;
      padding: 24px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      transition: transform .3s ease, box-shadow .3s ease;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 20px 45px rgba(0,0,0,.16);
    }

    .card h2 { margin-top: 0; }
  </style>
</head>
<body>
  <article class="card">
    <h2>Hover Me</h2>
    <p>A simple lift-and-shadow effect using only CSS transitions.</p>
  </article>
</body>
</html>
