<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shine Button</title>
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
    }

    .btn {
      position: relative;
      overflow: hidden;
      border: 0;
      border-radius: 999px;
      padding: 14px 26px;
      font-size: 16px;
      cursor: pointer;
      background: white;
      color: #111827;
    }

    .btn::before {
      content: "";
      position: absolute;
      top: -40%;
      left: -60%;
      width: 40%;
      height: 180%;
      transform: rotate(25deg);
      background: rgba(255,255,255,.75);
      filter: blur(2px);
      transition: left .55s ease;
    }

    .btn:hover::before {
      left: 120%;
    }
  </style>
</head>
<body>
  <button class="btn">Hover for Shine</button>
</body>
</html>
