<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip Calculator - WebPrims</title>
</head>
<body>
  <h1>Tip Calculator</h1>
  <input id="bill" type="number" min="0" step="0.01" placeholder="Bill amount">
  <input id="tip" type="number" min="0" step="1" value="10" placeholder="Tip %">
  <button id="calculate">Calculate</button>
  <p id="result">Enter an amount to begin.</p>

  <script src="script.js"></script>
</body>
</html>
