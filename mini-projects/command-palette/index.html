<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Command palette | WebPrims</title>
<style>
body{font:16px system-ui;margin:0;min-height:100vh;display:grid;place-content:center;background:#eef4ff;color:#14233e}button,input{font:inherit}button{cursor:pointer;border:1px solid #7894c5;border-radius:8px;background:white;padding:.7rem 1rem}button:focus-visible,input:focus-visible{outline:3px solid #2866db;outline-offset:2px}dialog{border:0;border-radius:14px;padding:1.4rem;width:min(30rem,85vw);box-shadow:0 20px 60px #14233e55}dialog::backdrop{background:#14233e88}input{box-sizing:border-box;width:100%;padding:.7rem;border:1px solid #8096bd;border-radius:8px}ul{padding:0;list-style:none}li button{width:100%;text-align:left;margin:.2rem 0}li button[aria-selected=true]{background:#dce8ff}p{max-width:34rem}
</style>
<main><h1>Command palette</h1><p>Open with Ctrl+K (⌘K on Mac). Type to filter, use arrows to choose, Enter to open and Escape to close.</p><button id="open">Open commands</button></main>
<dialog id="palette" aria-labelledby="title"><h2 id="title">Choose a WebPrims resource</h2><label for="query">Search commands</label><input id="query" autocomplete="off" aria-controls="results"><ul id="results"></ul><p id="status" role="status"></p><button id="close">Close</button></dialog>
<script src="script.js"></script></html>
